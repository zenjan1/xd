plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.xd'
    compileSdk 32

    defaultConfig {
        applicationId "com.example.xd"
        minSdk 29
        targetSdk 32
        versionCode 2
        versionName "2.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        resourceConfigurations += ["en", "zh-rCN"]
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            universalApk true
        }
        language {
            enable true
            reset()
            include "en", "zh-rCN"
            customDimension "locale"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    implementation 'com.google.code.gson:gson:2.8.9'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}

applicationVariants.configureEach { variant ->
    variant.outputs.each { output ->
        def abi = output.getFilter(com.android.build.OutputFile.ABI)
        def locale = output.getFilter(com.android.build.OutputFile.LOCALE)
        def versionName = variant.versionName

        if (abi != null && locale != null) {
            output.outputFileName = "xd-mock-gps_${versionName}_${locale}_${abi}.apk"
        } else if (abi != null) {
            output.outputFileName = "xd-mock-gps_${versionName}_${abi}.apk"
        } else if (locale != null) {
            output.outputFileName = "xd-mock-gps_${versionName}_${locale}.apk"
        }
    }
}
